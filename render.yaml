databases:
  - name: bill-db
    databaseName: bill
    user: bill
    plan: free
    region: oregon

services:
  - type: web
    name: bill-web
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/PeterZuo1/bill-app
    branch: master
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bill-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
